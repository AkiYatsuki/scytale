# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# 当前配色：由 ~/.zsh/starship-palette.zsh 自动维护（macOS 深浅色 / starship-theme 手动指定）
# 注意：palette 必须写在所有 [table] 之前，否则会被 TOML 归到上一个表里
palette = "everforest_dark"

# 当前布局：由 ~/.zsh/starship-palette.zsh 自动维护（starship-layout 切换）
# powerline / color / plain，三份 format 存在 ~/.zsh/themes/starship-formats/
# layout: color
format = """
[$os$username](bold fg:color_orange)\
[$directory](bold fg:color_yellow)\
[$git_branch$git_status](fg:color_aqua)\
[$c$cpp$rust$golang$nodejs$bun$php$java$kotlin$haskell$python](fg:color_blue)\
[$docker_context$conda$pixi](fg:color_text)\
[$time](fg:color_text)\
$line_break[$character](fg:color_green)"""

# 语义 token（所有 palette 都必须提供这 11 个键）：
#   color_fg0   强调色块上的文字（需与所有强调色高对比）
#   color_text  普通文字（time / docker 等浅底块）
#   color_bg1   最外层 time 块的底色
#   color_bg3   docker / conda / pixi 块的底色
#   color_{blue,aqua,green,orange,purple,red,yellow}  各功能块强调色
#
# 注意：模块自身不再设置 style/bg，颜色统一由上面的 format 负责，
# 这样切换布局（powerline / color / plain）只需要换 format 一处。

[os]
disabled = false
format = ' $symbol '

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
format = ' $user '

[directory]
format = ' $path '
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
format = ' $symbol $branch '

[git_status]
format = '($all_status$ahead_behind )'

[nodejs]
symbol = ""
format = ' $symbol( $version) '

[bun]
symbol = ""
format = ' $symbol( $version) '

[c]
symbol = " "
format = ' $symbol( $version) '

[cpp]
symbol = " "
format = ' $symbol( $version) '

[rust]
symbol = ""
format = ' $symbol( $version) '

[golang]
symbol = ""
format = ' $symbol( $version) '

[php]
symbol = " "
format = ' $symbol( $version) '

[java]
symbol = " "
format = ' $symbol( $version) '

[kotlin]
symbol = ""
format = ' $symbol( $version) '

[haskell]
symbol = ""
format = ' $symbol( $version) '

[python]
symbol = ""
format = ' $symbol( $version) '

[docker_context]
symbol = ""
format = ' $symbol( $context) '

[conda]
format = ' $symbol( $environment) '

[pixi]
format = ' $symbol( $version)( $environment) '

[time]
disabled = false
time_format = "%R"
format = ' $time '

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold)'
vimcmd_replace_one_symbol = '[](bold)'
vimcmd_replace_symbol = '[](bold)'
vimcmd_visual_symbol = '[](bold)'

